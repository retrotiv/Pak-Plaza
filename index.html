<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pak-Plaza — paks for every handheld</title>
<meta name="description" content="A catalog of paks for NextUI-based handhelds: Anbernic RG353V, TrimUI Brick and more.">
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151b; --panel2:#1c1c24; --line:#2a2a34;
    --ink:#f4f4f6; --muted:#9a9aa6; --amber:#ffab2e; --cyan:#5ad1c7;
    --accent:#ffab2e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
  header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 20px}
  header img{width:min(440px,86vw);height:auto}
  header p{color:var(--muted);margin:0;max-width:640px}
  .controls{position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);padding:14px 0;z-index:5}
  .devices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .tab[aria-selected="true"]{border-color:var(--accent);color:#0b0b0f;background:var(--accent)}
  .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:12px}
  .search{flex:1;min-width:200px;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:14px}
  .search:focus{outline:none;border-color:var(--accent)}
  .cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12.5px}
  .chip[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
  .count{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px}
  .card:hover{border-color:var(--accent)}
  .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cname{font-size:17px;font-weight:700;margin:0}
  .cat{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .desc{color:#cfcfd6;font-size:13.5px;margin:0;min-height:38px}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px}
  .b-adapted{background:rgba(255,171,46,.14);color:var(--amber);border:1px solid rgba(255,171,46,.4)}
  .b-original{background:rgba(90,209,199,.12);color:var(--cyan);border:1px solid rgba(90,209,199,.4)}
  .cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
  .by{font-size:12px;color:var(--muted)}
  .btn{font-size:12.5px;font-weight:700;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:7px 12px;white-space:nowrap}
  .btn:hover{background:var(--accent);color:#0b0b0f;text-decoration:none}
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:40px;line-height:1.7}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/logo.svg" alt="Pak-Plaza">
    <p>A catalog of paks for NextUI-based handhelds. Pick your device — RG353V builds are
       adapted for the Anbernic; every pak credits its original author.</p>
  </header>

  <div class="controls">
    <div class="devices" id="devices" role="tablist"></div>
    <div class="row2">
      <input class="search" id="search" type="search" placeholder="Search paks…" aria-label="Search paks">
      <div class="cats" id="cats"></div>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>

  <footer id="footer"></footer>
</div>

<script>
const state = { device:null, cat:"All", q:"", data:null };

function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const d = state.data; if(!d) return;
  const dev = d.devices.find(x=>x.id===state.device) || d.devices[0];
  document.documentElement.style.setProperty('--accent', dev.accent || '#ffab2e');

  // device tabs
  document.getElementById('devices').innerHTML = d.devices.map(x=>
    `<button class="tab" role="tab" aria-selected="${x.id===state.device}" data-dev="${x.id}">${escapeHtml(x.name)}</button>`).join('');

  // category chips
  const cats = ["All", ...d.categories];
  document.getElementById('cats').innerHTML = cats.map(c=>
    `<button class="chip" aria-selected="${c===state.cat}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');

  // filter
  const q = state.q.trim().toLowerCase();
  const items = d.paks.filter(p=>{
    if(!p.availability || !p.availability[state.device]) return false;
    if(state.cat!=="All" && p.category!==state.cat) return false;
    if(q && !(p.name.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q) || (p.author||"").toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('count').textContent =
    `${items.length} pak${items.length===1?'':'s'} for ${dev.name}`;

  document.getElementById('grid').innerHTML = items.length ? items.map(p=>{
    const kind = p.availability[state.device]; // "adapted" | "original"
    const badge = kind==="adapted"
      ? `<span class="badge b-adapted">RG353V-adapted</span>`
      : `<span class="badge b-original">original build</span>`;
    const by = p.author ? `Original by ${escapeHtml(p.author)}` : "";
    const link = p.source ? `<a class="btn" href="${escapeHtml(p.source)}" target="_blank" rel="noopener">View source ↗</a>` : "";
    return `<div class="card">
      <div class="ctop"><h3 class="cname">${escapeHtml(p.name)}</h3><span class="cat">${escapeHtml(p.category)}</span></div>
      ${badge}
      <p class="desc">${escapeHtml(p.desc||"")}</p>
      <div class="cfoot"><span class="by">${by}</span>${link}</div>
    </div>`;
  }).join('') : `<div class="empty">No paks listed for this device yet.</div>`;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-dev]'); if(t){ state.device=t.dataset.dev; render(); return; }
  const c = e.target.closest('[data-cat]'); if(c){ state.cat=c.dataset.cat; render(); return; }
});
document.getElementById('search').addEventListener('input', e=>{ state.q=e.target.value; render(); });

fetch('paks.json').then(r=>r.json()).then(d=>{
  state.data=d; state.device=d.devices[0].id;
  document.getElementById('footer').innerHTML =
    `Catalog updated ${escapeHtml(d.updated||"")}. Paks are built by the NextUI community; `+
    `RG353V versions are adapted by retrotiv. See <a href="CREDITS.md">credits</a> and the `+
    `<a href="https://github.com/retrotiv/Pak-Plaza">repository</a>.`;
  render();
}).catch(()=>{
  document.getElementById('grid').innerHTML =
    `<div class="empty">Could not load the catalog (paks.json). Open this page from GitHub Pages or a local server.</div>`;
});
</script>
</body>
</html>
