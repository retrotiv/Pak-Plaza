<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="Pak-Plaza">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="0.5" stop-color="#ffab2e"/><stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef7ea"/><stop offset="1" stop-color="#2fb6c7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151b"/><stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="748" height="208" rx="30" fill="url(#panel)"/>
  <rect x="6.5" y="6.5" width="747" height="207" rx="29.5" fill="none" stroke="#ffab2e" stroke-opacity="0.22"/>

  <!-- emblem: a 2x2 plaza of pak tiles, one highlighted, hinting many devices/apps -->
  <g transform="translate(58,62)" filter="url(#glow)">
    <rect x="0"  y="0"  width="44" height="44" rx="9" fill="none" stroke="url(#amber)" stroke-width="5"/>
    <rect x="52" y="0"  width="44" height="44" rx="9" fill="none" stroke="url(#cyan)"  stroke-width="5"/>
    <rect x="0"  y="52" width="44" height="44" rx="9" fill="none" stroke="url(#cyan)"  stroke-width="5"/>
    <rect x="52" y="52" width="44" height="44" rx="9" fill="url(#amber)"/>
    <!-- 'download/into device' chevron on the filled tile -->
    <path d="M74,64 L74,82 M66,74 L74,82 L82,74" fill="none" stroke="#15151b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(190,0)">
    <text x="6" y="132" filter="url(#glow)"
          font-family="'Eurostile','Bank Gothic','Arial Narrow','Franklin Gothic Medium',Impact,sans-serif"
          font-size="86" font-weight="800" letter-spacing="3" fill="url(#amber)" transform="skewX(-5)">PAK</text>
    <text x="214" y="132"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="86" font-weight="400" letter-spacing="1" fill="url(#cyan)">Plaza</text>
    <line x1="8" y1="156" x2="500" y2="156" stroke="#ffab2e" stroke-opacity="0.22" stroke-width="2"/>
    <text x="8" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="15" letter-spacing="5" fill="#8bb5bd">PAKS FOR EVERY HANDHELD</text>
  </g>
</svg>
